apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Clickable run_id links in log explorer
        - datasourceUid: loki
          matcherRegex: '"run_id":"([^"]+)"'
          name: run_id
          url: '/runs/$${__value.raw}'
          urlDisplayLabel: "View Run"
